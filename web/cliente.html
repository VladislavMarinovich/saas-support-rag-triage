<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Polaris · Contact Support</title>
  <meta name="description" content="Chat with Polaris support — the assistant answers from the knowledge base or routes you to the right team, live." />
  <link rel="stylesheet" href="styles.css" />
  <!-- Cloudflare Turnstile (captcha anti-abuso). Se valida server-side en el Worker. -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    /* ============ Vista cliente: CHAT DE BURBUJAS ============
       Reusa las variables de tema y .response-body de styles.css. La conversación
       es multi-turno (misma lógica de antes), re-piel a mensajería. */
    .chat {
      max-width: 680px; margin: 0 auto; height: 100dvh;
      display: flex; flex-direction: column;
    }
    /* --- cabecera --- */
    .chat-head {
      display: flex; align-items: center; gap: .7rem;
      padding: .9rem 1.1rem; border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .chat-head .avatar { flex-shrink: 0; }
    .chat-head .who { line-height: 1.2; }
    .chat-head .who b { font-size: .95rem; letter-spacing: -.01em; }
    .chat-head .who small { display: block; color: var(--text-dim); font-size: .76rem; }
    .chat-head .status {
      margin-left: auto; display: inline-flex; align-items: center; gap: .35rem;
      font-size: .74rem; color: var(--text-dim);
    }
    .chat-head .dot-live {
      width: .5rem; height: .5rem; border-radius: 50%; background: #22c55e;
      box-shadow: 0 0 0 3px color-mix(in srgb, #22c55e 22%, transparent);
    }
    /* avatar circular reutilizable */
    .avatar {
      width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center;
      font-weight: 700; font-size: .82rem; color: #fff;
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #7c3aed));
    }
    /* --- área de mensajes --- */
    .thread {
      flex: 1; overflow-y: auto; padding: 1.3rem 1.1rem 1rem;
      display: flex; flex-direction: column; gap: .85rem;
      scroll-behavior: smooth;
    }
    /* fila de mensaje */
    .msg { display: flex; gap: .55rem; align-items: flex-end; max-width: 100%; }
    .msg.user { justify-content: flex-end; }
    .msg.ai .avatar { flex-shrink: 0; }
    /* burbuja */
    .bubble {
      position: relative; max-width: 78%; padding: .7rem .9rem;
      border-radius: 16px; font-size: .9rem; line-height: 1.5;
      box-shadow: var(--shadow);
    }
    .msg.user .bubble {
      background: var(--accent); color: #fff; border-bottom-right-radius: 5px;
    }
    .msg.ai .bubble {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-bottom-left-radius: 5px;
    }
    .msg.user .bubble a { color: #fff; text-decoration: underline; }
    /* cabecera dentro de la burbuja AI (badge de estado) */
    .post-head { display: flex; align-items: center; gap: .4rem; margin-bottom: .3rem; }
    .verified {
      display: inline-flex; align-items: center; gap: .35rem;
      font-size: .72rem; font-weight: 700; color: var(--accent);
    }
    .verified.escalated { color: #b45309; }
    .verified.resolved { color: #15803d; }
    /* cuerpo de la respuesta (markdown) */
    .response-body p { margin: 0 0 .5rem; }
    .response-body p:last-child { margin-bottom: 0; }
    .response-body ol, .response-body ul { margin: .3rem 0 .5rem; padding-left: 1.2rem; }
    .response-body li { margin: .15rem 0; }
    .response-body code {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 5px; padding: .05rem .3rem; font-size: .85em;
    }
    .response-body a { color: var(--accent); }
    /* cursor de tipeo mientras streamea */
    .cursor { display: inline-block; width: .5rem; height: 1rem; margin-left: 1px; vertical-align: text-bottom;
      background: var(--accent); border-radius: 1px; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    /* fuentes reales de la KB */
    .sources { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin-top: .7rem; }
    .src-lbl { font-size: .66rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); font-weight: 700; }
    .src-badge { font-size: .72rem; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 999px; padding: .18rem .55rem; color: var(--text); }
    .src-badge::before { content: "📄 "; }
    /* utilidad / escalación */
    .helpful { display: flex; flex-wrap: wrap; align-items: center; gap: .45rem; margin-top: .8rem;
      padding-top: .7rem; border-top: 1px solid var(--border); }
    .hlp-q { font-size: .78rem; color: var(--text-dim); margin-right: .1rem; }
    .hlp-btn { font: inherit; font-size: .76rem; cursor: pointer; background: var(--bg);
      color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: .28rem .65rem; }
    .hlp-btn:hover { border-color: var(--accent); }
    .hlp-btn.human { margin-left: auto; color: var(--accent); }
    .hlp-done { font-size: .8rem; color: var(--text); }
    /* triage colapsable (sutil) */
    .triage-fold { margin-top: .8rem; }
    .triage-fold summary { font-size: .72rem; color: var(--text-dim); cursor: pointer; list-style: none; }
    .triage-fold summary::-webkit-details-marker { display: none; }
    .triage-fold summary::before { content: "▸ "; }
    .triage-fold[open] summary::before { content: "▾ "; }
    .triage-fold .labels { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .55rem; }
    .triage-fold .chip { font-size: .7rem; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 8px; padding: .18rem .5rem; }
    .triage-fold .chip b { color: var(--text-dim); font-weight: 600; text-transform: capitalize; }
    /* nota de cierre del hilo (resuelto / escalado) — centrada */
    .thread-end { margin: .3rem auto 0; padding: .55rem .9rem; border-radius: 10px;
      font-size: .8rem; text-align: center; max-width: 90%; }
    .thread-end.resolved { background: color-mix(in srgb, #15803d 12%, var(--bg)); color: #15803d;
      border: 1px solid color-mix(in srgb, #15803d 30%, var(--border)); }
    .thread-end.escalated { background: color-mix(in srgb, #b45309 12%, var(--bg)); color: #b45309;
      border: 1px solid color-mix(in srgb, #b45309 30%, var(--border)); }
    .err-inline { color: #c02626; }
    /* --- composer (barra de escritura, fija abajo) --- */
    .composer { border-top: 1px solid var(--border); background: var(--surface);
      padding: .7rem 1.1rem calc(.7rem + env(safe-area-inset-bottom)); }
    .composer .cf-turnstile { margin-bottom: .6rem; }
    .composer-row { display: flex; gap: .5rem; align-items: flex-end; }
    .composer textarea {
      flex: 1; font: inherit; color: var(--text); background: var(--bg);
      border: 1px solid var(--border); border-radius: 12px; padding: .6rem .8rem;
      resize: none; min-height: 2.6rem; max-height: 8rem; line-height: 1.4;
    }
    .composer textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    .composer .send {
      flex-shrink: 0; width: 2.6rem; height: 2.6rem; border: none; border-radius: 50%;
      background: var(--accent); color: #fff; cursor: pointer; font-size: 1.1rem;
      display: grid; place-items: center;
    }
    .composer .send:disabled { opacity: .5; cursor: default; }
    .err { color: #c02626; font-size: .8rem; margin-top: .45rem; min-height: 1rem; }
    .composer .foot { text-align: center; color: var(--text-dim); font-size: .72rem; margin-top: .5rem; }
    .composer .foot a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="chat">
    <header class="chat-head">
      <span class="avatar">P</span>
      <span class="who"><b>Polaris Support</b><small>Answers from the knowledge base, live</small></span>
      <span class="status"><span class="dot-live"></span>Online</span>
    </header>

    <div class="thread" id="thread">
      <!-- burbuja de bienvenida (estática) -->
      <div class="msg ai">
        <span class="avatar">P</span>
        <div class="bubble">
          <div class="response-body">Hi! I'm Polaris support. Describe your issue and I'll answer from our knowledge base — or route you to the right team.</div>
        </div>
      </div>
    </div>

    <form class="composer" id="composer">
      <!-- widget Turnstile: solo se necesita en el PRIMER mensaje; se oculta después -->
      <div class="cf-turnstile" id="ts" data-sitekey="0x4AAAAAAECRIY52By-q-Pnp"></div>
      <div class="composer-row">
        <textarea id="input" rows="1" maxlength="2000" required
          placeholder="Type your message…"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send">➤</button>
      </div>
      <div class="err" id="err"></div>
      <div class="foot">
        <a href="index.html">See the operator console →</a> · Demo over synthetic data — model-generated answers.
      </div>
    </form>
  </div>

  <script src="cliente.js"></script>
</body>
</html>
