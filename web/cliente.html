<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Polaris · Contact Support</title>
  <meta name="description" content="Ask Polaris support — the assistant answers from the knowledge base or routes you to the right team, live." />
  <link rel="stylesheet" href="styles.css" />
  <!-- Cloudflare Turnstile (captcha anti-abuso). Se valida server-side en el Worker. -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    /* Vista cliente: más cálida y centrada que el foro de operador. Reusa las
       variables de tema y los estilos de .response-body de styles.css. */
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 1.2rem 3rem; }
    .intro { text-align: center; padding: 2.2rem 0 1.4rem; }
    .intro h1 { font-size: 1.5rem; margin: 0 0 .4rem; letter-spacing: -.02em; }
    .intro p { color: var(--text-dim); margin: 0; font-size: .95rem; }
    .card { background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.3rem; box-shadow: var(--shadow); }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: .82rem; font-weight: 600; margin-bottom: .35rem; }
    .field input, .field textarea { width: 100%; font: inherit; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: .6rem .75rem; }
    .field textarea { min-height: 130px; resize: vertical; }
    .field input:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    .submit { width: 100%; font: inherit; font-weight: 600; color: #fff; background: var(--accent);
      border: none; border-radius: 10px; padding: .7rem; cursor: pointer; margin-top: .2rem; }
    .submit:disabled { opacity: .55; cursor: default; }
    .err { color: #c02626; font-size: .85rem; margin-top: .6rem; min-height: 1rem; }
    /* ---- vista hilo (post original + respuesta verificada) ---- */
    .answer { margin-top: 1.4rem; }
    .thread { display: flex; flex-direction: column; gap: .8rem; }
    .post { border: 1px solid var(--border); border-radius: 12px; padding: .9rem 1rem; }
    .post.op { background: var(--surface-2); }
    .post.reply { background: var(--bg); border-color: color-mix(in srgb, var(--accent) 32%, var(--border)); }
    .post-head { display: flex; align-items: center; gap: .4rem; font-size: .72rem; color: var(--text-dim); margin-bottom: .4rem; }
    .post-head .who { font-weight: 700; color: var(--text); }
    .post-title { font-weight: 650; font-size: .95rem; margin-bottom: .2rem; }
    .post-body { font-size: .88rem; color: var(--text); white-space: pre-wrap; }
    .verified { display: inline-flex; align-items: center; gap: .35rem; font-size: .74rem; font-weight: 700; color: var(--accent); }
    /* fuentes reales de la KB */
    .sources { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin-top: .9rem; }
    .src-lbl { font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); font-weight: 700; }
    .src-badge { font-size: .74rem; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 999px; padding: .2rem .6rem; color: var(--text); }
    .src-badge::before { content: "📄 "; }
    /* utilidad / escalación */
    .helpful { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin-top: 1rem;
      padding-top: .85rem; border-top: 1px solid var(--border); }
    .hlp-q { font-size: .8rem; color: var(--text-dim); margin-right: .2rem; }
    .hlp-btn { font: inherit; font-size: .78rem; cursor: pointer; background: var(--surface);
      color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: .3rem .7rem; }
    .hlp-btn:hover { border-color: var(--accent); }
    .hlp-btn.human { margin-left: auto; color: var(--accent); }
    .hlp-done { font-size: .82rem; color: var(--text); }
    /* triage colapsable (sutil, no protagonista) */
    .triage-fold { margin-top: .9rem; }
    .triage-fold summary { font-size: .74rem; color: var(--text-dim); cursor: pointer; list-style: none; }
    .triage-fold summary::-webkit-details-marker { display: none; }
    .triage-fold summary::before { content: "▸ "; }
    .triage-fold[open] summary::before { content: "▾ "; }
    .triage-fold .labels { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .6rem; }
    .triage-fold .chip { font-size: .72rem; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 8px; padding: .2rem .55rem; }
    .triage-fold .chip b { color: var(--text-dim); font-weight: 600; text-transform: capitalize; }
    .footnote { text-align: center; color: var(--text-dim); font-size: .78rem; padding: 1.5rem; }
    .backlink { color: var(--accent); text-decoration: none; font-size: .82rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="intro">
      <h1>How can we help?</h1>
      <p>Describe your issue. Our assistant answers from the knowledge base instantly, or routes you to the right team.</p>
    </div>

    <div class="card">
      <form id="form">
        <div class="field">
          <label for="subject">Subject <span style="font-weight:400;color:var(--text-dim)">(optional)</span></label>
          <input id="subject" type="text" maxlength="120" placeholder="e.g. Dashboard won't load" />
        </div>
        <div class="field">
          <label for="message">Your message</label>
          <textarea id="message" maxlength="2000" required placeholder="Tell us what's going on…"></textarea>
        </div>
        <!-- widget Turnstile: inserta un token oculto (cf-turnstile-response) al pasar -->
        <div class="field cf-turnstile" data-sitekey="0x4AAAAAAECRIY52By-q-Pnp"></div>
        <button class="submit" id="submit" type="submit">Send message</button>
        <div class="err" id="err"></div>
      </form>

      <div class="answer" id="answer" hidden></div>
    </div>

    <p class="footnote">
      <a class="backlink" href="index.html">← See the support console (operator view)</a><br />
      Demo over synthetic data — model-generated answers.
    </p>
  </div>

  <script src="cliente.js"></script>
</body>
</html>
